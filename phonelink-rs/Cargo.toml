[package]
name = "phonelink-rs"
version = "0.3.6"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "PhoneRelay for Linux (Rust port)"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
native-tls = "0.2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
gio = "0.22"
glib = "0.22"
# Feature levels = the oldest versions the app supports (core::compat):
# GTK 4.10 / libadwaita 1.4 (Ethan, 2026-11-05: wide reach).
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
regex = "1"
# Search ignores accents (core::search).
unicode-normalization = "0.1"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# Google Contacts (Phase 6): blocking HTTP on a worker, system OpenSSL for TLS.
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
tempfile = "3"

