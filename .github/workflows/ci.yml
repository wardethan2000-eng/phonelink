name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token: CI only builds and tests.
permissions:
  contents: read

# Third-party actions are pinned to full commits (tag in the comment), so a
# moved tag can't change what runs here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Use the distro's python3 (not actions/setup-python) so the apt-installed
      # GObject-Introspection typelibs are importable.  No display is needed —
      # the panel tests exercise reconciliation without constructing widgets.
      - name: Install GTK4 / Libadwaita typelibs and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-pytest

      - name: Byte-compile all modules
        run: python3 -m compileall -q phonelink

      - name: Run test suite
        run: python3 -m pytest -q

  # The Rust app on the oldest distro the release supports (GTK 4.14,
  # libadwaita 1.5, glibc 2.39).
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install GTK 4 / libadwaita headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libsqlite3-dev libssl-dev \
            pkg-config libglib2.0-dev-bin dbus

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-07
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # dbus-run-session gives the mock-daemon test a session bus. The
      # Google Contacts import test hangs without a network login; skip it.
      - name: Tests
        run: dbus-run-session -- cargo test -- --skip import_names_and_chat_photos

  helper:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phonelink-gm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: phonelink-gm/go.mod
          cache-dependency-path: phonelink-gm/go.sum
      - run: go vet ./... && go test ./...
